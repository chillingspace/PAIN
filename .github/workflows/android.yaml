name: Pain Engine Android CI
permissions:
  contents: read

on:
  push:
    branches:
      - main
      - more-cicd
      - more-more-cicd
  pull_request:
    branches: 
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android-debug:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install NDK 27.0.12077973
        run: |
          $sdkmanager = "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager"
          & $sdkmanager "ndk;27.0.12077973"

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v2

      - name: Configure cross-platform files
        run: .\build.bat

      - name: Build Android Debug
        working-directory: android
        run: .\gradlew.bat assembleDebug --stacktrace --parallel
        env:
          SKIP_SIGNING: true 
          CI_ABI: x86_64

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  build-android-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install NDK 27.0.12077973
        run: |
          $sdkmanager = "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager"
          & $sdkmanager "ndk;27.0.12077973"

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v2

      - name: Configure cross-platform files
        run: .\build.bat

      - name: Prepare Signing Properties
        working-directory: android
        shell: pwsh
        run: |
          $storePassword = "${{ secrets.ANDROID_STORE_PASSWORD }}"
          $keyPassword = "${{ secrets.ANDROID_KEY_PASSWORD }}"
          $keyAlias = "${{ secrets.ANDROID_KEY_ALIAS }}"
          
          if ([string]::IsNullOrWhiteSpace($storePassword)) { $storePassword = "password" }
          if ([string]::IsNullOrWhiteSpace($keyPassword)) { $keyPassword = "password" }
          if ([string]::IsNullOrWhiteSpace($keyAlias)) { $keyAlias = "key0" }

          $content = @"
          storeFile=keystore/release.keystore
          storePassword=$storePassword
          keyAlias=$keyAlias
          keyPassword=$keyPassword
          "@
          $content | Out-File -FilePath key.properties -Encoding ascii

      - name: Build Android Release
        working-directory: android
        run: .\gradlew.bat assembleRelease --stacktrace --parallel
        env:
          CI_ABI: arm64-v8a

      - name: Upload Intermediate Release APK
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk-raw
          path: android/app/build/outputs/apk/release/*.apk

  cd-android:
    needs: build-android-release
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/cd-android.yaml
    with:
      run_id: ${{ github.run_id }}
