name: Pain Engine Android CI
permissions:
  contents: read

on:
  push:
    branches:
      - main
      - more-cicd
      - more-more-cicd
  pull_request:
    branches: 
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install NDK 27.0.12077973
        run: |
          $sdkmanager = "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager"
          & $sdkmanager "ndk;27.0.12077973"

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v2

      - name: Configure cross-platform files
        run: .\build.bat

      - name: Build Android app
        working-directory: android
        run: .\gradlew.bat assembleDebug assembleRelease --stacktrace --parallel
        env:
          SKIP_SIGNING: true 
          CI_ABI: x86_64

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: android/app/build/outputs/apk/release/*.apk  
