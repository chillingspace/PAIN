name: Pain Engine CI

on:
  push:
    branches:
      - main
  pull_request:
    branches: 
      - main

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v2
      - name: Build Windows (build.bat)
        run: .\build.bat
      - name: Build Debug solution
        run: |
          cd build
          msbuild pain.sln /p:Configuration=Debug
      - name: Run Debug executable and test for leaks/crashes
        run: |
          cd bin/Debug
          # Set CI environment variable
          $env:CI = "1"
          
          $process = Start-Process .\Game.exe -PassThru -RedirectStandardError leak_report.txt
          
          # Wait up to 10 seconds
          $timeout = 10
          $elapsed = 0
          while ($elapsed -lt $timeout -and !$process.HasExited) {
            Start-Sleep -Seconds 1
            $elapsed++
          }
          
          # Force kill if still running
          if (!$process.HasExited) {
            Stop-Process -Id $process.Id -Force
          }
          
          Wait-Process -Id $process.Id -ErrorAction SilentlyContinue
          
          # Check for early crashes (before timeout)
          if ($elapsed -lt $timeout -and $process.ExitCode -ne 0) {
            Write-Error "Application crashed early with exit code: $($process.ExitCode)"
            Get-Content leak_report.txt -ErrorAction SilentlyContinue
            exit 1
          }
          
          # Check for memory leaks
          if (Test-Path leak_report.txt) {
            if (Select-String -Path leak_report.txt -Pattern "Detected memory leaks") {
              Write-Error "Memory leaks detected!"
              Get-Content leak_report.txt
              exit 1
            }
          }
          
          Write-Host "Debug build test completed successfully"
        shell: pwsh



      - name: Build Release solution
        run: |
          cd build
          msbuild pain.sln /p:Configuration=Release
      - name: Run Release executable and test for crashes
        run: |
          cd bin/Release
          $process = Start-Process .\Game.exe -PassThru
          
          # Wait up to 10 seconds
          $timeout = 10
          $elapsed = 0
          while ($elapsed -lt $timeout -and !$process.HasExited) {
            Start-Sleep -Seconds 1
            $elapsed++
          }
          
          # Force kill if still running after timeout
          if (!$process.HasExited) {
            Write-Host "Stopping process after $timeout seconds..."
            Stop-Process -Id $process.Id -Force
          }
          
          # Wait for process to fully exit
          Wait-Process -Id $process.Id -ErrorAction SilentlyContinue
          
          # Check exit code for crashes (non-zero = crash/error)
          # Note: -1 is used when process is force-killed, so ignore that
          if ($process.ExitCode -ne 0 -and $process.ExitCode -ne $null -and $process.ExitCode -ne -1) {
            Write-Error "Application crashed with exit code: $($process.ExitCode)"
            exit 1
          }
          
          Write-Host "Release build test completed successfully"
        shell: pwsh


  build-android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install NDK 27.0.12077973
        run: |
          $sdkmanager = "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager"
          & $sdkmanager "ndk;27.0.12077973"
      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v2
      - name: Run build.bat first
        run: .\build.bat
      - name: Build Android app (x86_64)
        working-directory: android
        env:
          CI_ABI: x86_64
        run: .\gradlew.bat assembleDebug
