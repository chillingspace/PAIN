name: Pain Engine Windows CI
permissions:
  contents: read

on:
  push:
    branches:
      - main
      - more-cicd
      - more-more-cicd
  pull_request:
    branches: 
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CMAKE_BUILD_PARALLEL_LEVEL: 8

jobs:
  cppcheck:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
    
    - name: Cache Cppcheck
      id: cache-cppcheck
      uses: actions/cache@v4
      with:
        path: "C:\\Program Files\\Cppcheck"
        key: cppcheck-2.18.0

    - name: Download and Install Cppcheck
      if: steps.cache-cppcheck.outputs.cache-hit != 'true'
      run: |
        Invoke-WebRequest -Uri "https://github.com/danmar/cppcheck/releases/download/2.18.0/cppcheck-2.18.0-x64-Setup.msi" -OutFile "cppcheck-setup.msi"
        Start-Process msiexec.exe -Wait -ArgumentList '/I cppcheck-setup.msi /quiet'

    - name: Run cppcheck
      run: |
        & "C:\\Program Files\\Cppcheck\\cppcheck.exe" `
          --error-exitcode=1 `
          --force `
          --enable=warning,style `
          --inconclusive `
          --std=c++20 `
          --suppress=missingIncludeSystem `
          --suppress=missingInclude `
          --suppress=cstyleCast `
          --suppress=useStlAlgorithm `
          --suppress=functionStatic `
          --suppress=funcArgNamesDifferent `
          --suppress=passedByValue `
          --suppress=functionConst `
          --suppress=constParameterReference `
          --suppress=noExplicitConstructor `
          --suppress=constVariableReference `
          --suppress=variableScope `
          --suppress=useInitializationList `
          --suppress=initializerList `
          --suppress=uselessCallsSubstr `
          --suppress=returnByReference `
          --suppress=unusedStructMember `
          --suppress=constVariablePointer `
          --suppress=constVariable `
          --suppress=constParameterPointer `
          --suppress=constParameterCallback `
          --suppress=duplicateValueTernary `
          --suppress=redundantInitialization `
          --suppress=redundantIfRemove `
          --suppress=redundantAssignment `
          --suppress=unreadVariable `
          --suppress=knownConditionTrueFalse `
          --suppress=shadowVariable `
          --suppress=duplicateBreak `
          --suppress=unknownMacro `
          --suppress=dangerousTypeCast `
          --suppress=duplicateBranch `
          --suppress=unusedPrivateFunction `
          --suppress=uselessOverride `
          --suppress=duplicateConditionalAssign `
          --suppress=stlFindInsert `
          --suppress=duplicateCondition `
          -i vendor `
          -i PAINEngine/src/PAINEngine/CoreSystems/Renderer/stb_image.h `
          "--suppress=*:*stb_image.h" `
          -i android/app/src/main/cpp/native_app_glue `
          -D PN_PLATFORM_WINDOWS `
          -D PN_PLATFORM_ANDROID `
          --check-level=exhaustive `
          --output-file=cppcheck_report.txt .
          
    - name: Display Cppcheck report on failure
      if: failure()
      run: |
        if (Test-Path cppcheck_report.txt) {
          Get-Content cppcheck_report.txt
        }
        
    - name: Upload Cppcheck report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cppcheck_report
        path: cppcheck_report.txt

  build-windows-debug:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache CMake _deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-windows-deps-${{ hashFiles('**/CMakeLists.txt', 'cmake/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-windows-deps-
      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v2
      - name: Build Windows (Debug)
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Debug -j $env:CMAKE_BUILD_PARALLEL_LEVEL
        shell: pwsh
      - name: Setup Software OpenGL (Mesa)
        run: |
          Invoke-WebRequest -Uri "https://github.com/pal1000/mesa-dist-win/releases/download/24.0.3/mesa3d-24.0.3-release-msvc.7z" -OutFile "mesa.7z"
          7z x mesa.7z -omesa_temp -y
        shell: pwsh
      - name: Run Tests (Debug)
        run: |
          $exe = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter "Friends-Frog-ever.exe" -Recurse | Where-Object { $_.FullName -match "bin/Debug" } | Select-Object -First 1
          if (!$exe) { Write-Error "Could not find Friends-Frog-ever.exe in Debug bin!"; exit 1 }
          $targetDir = $exe.DirectoryName
          Copy-Item -Path "assets" -Destination $targetDir -Recurse -Force -ErrorAction SilentlyContinue
          foreach ($tool in @("cuttlefish", "ffmpeg")) {
              $toolSource = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Directory -Filter $tool -Recurse | Select-Object -First 1
              if ($toolSource) { Copy-Item -Path $toolSource.FullName -Destination $targetDir -Recurse -Force }
          }
          Get-ChildItem -Path "vendor" -Filter "*.dll" -Recurse | Where-Object { $_.FullName -match "x64" } | ForEach-Object { Copy-Item $_.FullName $targetDir -Force }
          $mesaFolder = Get-ChildItem -Path "mesa_temp" -Directory -Filter "x64" -Recurse | Select-Object -First 1
          if ($mesaFolder) { Get-ChildItem -Path $mesaFolder.FullName -Filter "*.dll" | ForEach-Object { Copy-Item $_.FullName $targetDir -Force } }
          cd $targetDir
          $proc = Start-Process .\Friends-Frog-ever.exe -PassThru -RedirectStandardOutput "app_stdout.log" -RedirectStandardError "app_stderr.log"
          Start-Sleep -Seconds 120
          if ($proc.HasExited) { exit 1 }
          if (!$proc.CloseMainWindow()) { taskkill /IM Friends-Frog-ever.exe }
          $proc.WaitForExit(120000)
        shell: pwsh

  build-windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache CMake _deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-windows-deps-${{ hashFiles('**/CMakeLists.txt', 'cmake/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-windows-deps-
      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v2
      - name: Build Windows (Release)
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release -j $env:CMAKE_BUILD_PARALLEL_LEVEL
        shell: pwsh
      - name: Setup Software OpenGL (Mesa)
        run: |
          Invoke-WebRequest -Uri "https://github.com/pal1000/mesa-dist-win/releases/download/24.0.3/mesa3d-24.0.3-release-msvc.7z" -OutFile "mesa.7z"
          7z x mesa.7z -omesa_temp -y
        shell: pwsh
      - name: Run Tests (Release)
        run: |
          $targetDir = "bin/Release"
          if (!(Test-Path $targetDir/Friends-Frog-ever.exe)) { Write-Error "Could not find Friends-Frog-ever.exe in Release bin!"; exit 1 }
          
          # Sync all dependencies exactly as the local GAMEDIRECTORY expects
          Write-Host "Syncing all dependencies to $targetDir..."
          
          # Copy Assets (Ensure they are present)
          if (!(Test-Path "$targetDir/assets")) {
              Copy-Item -Path "assets" -Destination $targetDir -Recurse -Force -ErrorAction SilentlyContinue
          }

          # Copy Tools
          foreach ($tool in @("cuttlefish", "ffmpeg")) {
              $toolSource = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Directory -Filter $tool -Recurse | Select-Object -First 1
              if ($toolSource) {
                  $targetToolPath = Join-Path $targetDir $toolSource.Name
                  if (!(Test-Path $targetToolPath)) {
                      Copy-Item -Path $toolSource.FullName -Destination $targetDir -Recurse -Force
                  }
              }
          }

          # Copy Vendor x64 DLLs
          Get-ChildItem -Path "vendor" -Filter "*.dll" -Recurse | Where-Object { $_.FullName -match "x64" } | ForEach-Object {
              Copy-Item $_.FullName $targetDir -Force -ErrorAction SilentlyContinue
          }

          # Setup Mesa for testing
          $mesaFolder = Get-ChildItem -Path "mesa_temp" -Directory -Filter "x64" -Recurse | Select-Object -First 1
          if ($mesaFolder) { Get-ChildItem -Path $mesaFolder.FullName -Filter "*.dll" | ForEach-Object { Copy-Item $_.FullName $targetDir -Force } }
          
          cd $targetDir
          $proc = Start-Process .\Friends-Frog-ever.exe -PassThru -RedirectStandardOutput "app_stdout.log" -RedirectStandardError "app_stderr.log"
          Start-Sleep -Seconds 60
          if ($proc.HasExited) { exit 1 }
          if (!$proc.CloseMainWindow()) { taskkill /IM Friends-Frog-ever.exe }
          $proc.WaitForExit(30000)
        shell: pwsh
      - name: Upload Build Artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-bin
          path: bin/Release/

  cd-windows:
    needs: build-windows-release
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/cd.yaml
    with:
      platform: 'windows'
      run_id: ${{ github.run_id }}
