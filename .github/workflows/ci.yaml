name: Pain Engine CI

on:
  push:
    branches:
      - main
  pull_request:
    branches: 
      - main

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build Windows (build.bat)
        run: .\build.bat

  build-android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install NDK 27.0.12077973
        run: ${ANDROID_HOME}/tools/bin/sdkmanager "ndk;27.0.12077973"
      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v2
      - name: Run build.bat first
        run: .\build.bat
      - name: Build Android app
        working-directory: android
        run: .\gradlew.bat assembleDebug
