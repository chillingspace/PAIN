name: Pain Engine CI
permissions:
  contents: read

on:
  push:
    branches:
      - main
      - more-cicd
  pull_request:
    branches: 
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CMAKE_BUILD_PARALLEL_LEVEL: 8

jobs:
  cppcheck:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
    
    - name: Cache Cppcheck
      id: cache-cppcheck
      uses: actions/cache@v4
      with:
        path: "C:\\Program Files\\Cppcheck"
        key: cppcheck-2.18.0

    - name: Download and Install Cppcheck
      if: steps.cache-cppcheck.outputs.cache-hit != 'true'
      run: |
        Invoke-WebRequest -Uri "https://github.com/danmar/cppcheck/releases/download/2.18.0/cppcheck-2.18.0-x64-Setup.msi" -OutFile "cppcheck-setup.msi"
        Start-Process msiexec.exe -Wait -ArgumentList '/I cppcheck-setup.msi /quiet'

    - name: Run cppcheck
      run: |
        & "C:\\Program Files\\Cppcheck\\cppcheck.exe" `
          --error-exitcode=1 `
          --force `
          --enable=warning,style `
          --inconclusive `
          --std=c++20 `
          --suppress=missingIncludeSystem `
          --suppress=missingInclude `
          -i vendor `
          -D PN_PLATFORM_WINDOWS `
          -D PN_PLATFORM_ANDROID `
          --check-level=exhaustive `
          --output-file=cppcheck_report.txt .
          
    - name: Display Cppcheck report on failure
      if: failure()
      run: |
        if (Test-Path cppcheck_report.txt) {
          Get-Content cppcheck_report.txt
        }
        
    - name: Upload Cppcheck report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cppcheck_report
        path: cppcheck_report.txt

  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v5

      - name: Cache CMake _deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-windows-deps-${{ hashFiles('**/CMakeLists.txt', 'cmake/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-windows-deps-

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v2

      - name: Build Windows
        run: |
          .\build.bat ${{ matrix.configuration }}
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 8

      - name: Setup Software OpenGL (Mesa)
        run: |
          Invoke-WebRequest -Uri "https://github.com/pal1000/mesa-dist-win/releases/download/24.0.3/mesa3d-24.0.3-release-msvc.7z" -OutFile "mesa.7z"
          7z x mesa.7z -omesa_temp -y
        shell: pwsh

      - name: Run executable and test for graceful exit
        run: |
          # 1. FIND the executable in the bin folder
          Write-Host "Searching for Friends-Frog-ever.exe in bin/..."
          $exe = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter "Friends-Frog-ever.exe" -Recurse | Where-Object { $_.FullName -match "bin" } | Select-Object -First 1
          
          if (!$exe) {
              Write-Error "Could not find Friends-Frog-ever.exe in any bin directory!"
              exit 1
          }

          $targetDir = $exe.DirectoryName
          Write-Host "Target Directory identified: $targetDir"

          # 2. FORCE SYNC ALL DEPENDENCIES
          Write-Host "Syncing all dependencies to $targetDir..."
          
          # Copy Assets
          Copy-Item -Path "assets" -Destination $targetDir -Recurse -Force -ErrorAction SilentlyContinue

          # Copy Tools
          foreach ($tool in @("cuttlefish", "ffmpeg")) {
              $toolSource = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Directory -Filter $tool -Recurse | Select-Object -First 1
              if ($toolSource) {
                  $targetToolPath = Join-Path $targetDir $toolSource.Name
                  if ($toolSource.FullName -ne $targetToolPath) {
                      Copy-Item -Path $toolSource.FullName -Destination $targetDir -Recurse -Force
                  }
              }
          }

          # Copy ONLY x64 DLLs from vendor (strictly filter for x64 or neutral paths)
          Write-Host "Copying vendor x64 DLLs..."
          Get-ChildItem -Path "vendor" -Filter "*.dll" -Recurse | Where-Object { $_.FullName -match "x64" } | ForEach-Object {
              Copy-Item $_.FullName $targetDir -Force
              Write-Host "Synced: $($_.Name)"
          }

          # Copy Mesa Software OpenGL (Specifically x64 llvmpipe)
          # We search for the large opengl32.dll in the x64 folder of mesa_temp
          $mesaDll = Get-ChildItem -Path "mesa_temp" -Filter "opengl32.dll" -Recurse | Where-Object { $_.FullName -match "x64" -and $_.Length -gt 10MB } | Select-Object -First 1
          if ($mesaDll) {
              Copy-Item $mesaDll.FullName $targetDir -Force
              Write-Host "Synced x64 Mesa: $($mesaDll.FullName) ($([math]::round($mesaDll.Length/1MB, 2)) MB)"
          } else {
              Write-Error "Could not find a valid x64 Mesa opengl32.dll (>10MB)!"
          }

          # 3. VERIFY directory content
          cd $targetDir
          Write-Host "--- Final Directory Listing ($targetDir) ---"
          Get-ChildItem | Select-Object Name, @{Name="MB";Expression={[math]::round($_.Length / 1MB, 2)}} | Out-Host
          
          # 4. START PROCESS
          $proc = Start-Process .\Friends-Frog-ever.exe -PassThru -RedirectStandardOutput "app_stdout.log" -RedirectStandardError "app_stderr.log"
          Write-Host "Process started with PID: $($proc.Id)"
          
          Start-Sleep -Seconds 15
          
          if ($proc.HasExited) {
             Write-Host "--- APP STDOUT ---"
             Get-Content "app_stdout.log" -ErrorAction SilentlyContinue | Out-Host
             Write-Host "--- APP STDERR ---"
             Get-Content "app_stderr.log" -ErrorAction SilentlyContinue | Out-Host
             Write-Error "Application exited unexpectedly with code $($proc.ExitCode)."
             exit 1
          }

          Write-Host "MainWindowHandle: $($proc.MainWindowHandle)"
          
          $success = $proc.CloseMainWindow()
          Write-Host "CloseMainWindow returned: $success"
          if (!$success) { 
              Write-Host "Falling back to taskkill..."
              taskkill /IM Friends-Frog-ever.exe 
          }
          
          $proc.WaitForExit(5000)
          
          if (!$proc.HasExited) {
              Write-Host "Process did not exit, forcing stop..."
              Stop-Process -Id $proc.Id -Force
              exit 1
          }
          Write-Host "Process exited successfully."
        shell: pwsh

  build-android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install NDK 27.0.12077973
        run: |
          $sdkmanager = "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager"
          & $sdkmanager "ndk;27.0.12077973"

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v2

      - name: Configure cross-platform files
        run: .\build.bat

      - name: Build Android app
        working-directory: android
        run: .\gradlew.bat assembleDebug assembleRelease --stacktrace --parallel
        env:
          SKIP_SIGNING: true 
          CI_ABI: x86_64

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: android/app/build/outputs/apk/release/*.apk  
