name: Pain Engine CI

on:
  push:
    branches:
      - main
  pull_request:
    branches: 
      - main

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Cache build directory
        uses: actions/cache@v3
        with:
          path: build
          key: ${{ runner.os }}-build-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-build-
      - name: Download Cppcheck
        run: |
          curl -L -o cppcheck.zip https://github.com/danmar/cppcheck/releases/download/2.14.0/cppcheck-2.14.0-x64.zip
          tar -xf cppcheck.zip || unzip cppcheck.zip
      - name: Run cppcheck static analysis
        run: |
          ./cppcheck-2.14.0-x64/cppcheck --enable=warning,style,performance,portability --std=c++20 --output-file=cppcheck_report.txt . 2> cppcheck_report.txt
      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v2
      - name: Build Windows (build.bat)
        run: .\build.bat
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4

      - name: Build Debug solution
        run: |
          cd build
          msbuild pain.sln /p:Configuration=Debug
      - name: Run Debug executable and test for leaks/crashes
        run: |
          cd bin/Debug
          # Start the exe, wait 10s, kill if still running
          Start-Process .\Game.exe
          Start-Sleep -Seconds 10
          Stop-Process -Name Game -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Build Release solution
        run: |
          cd build
          msbuild pain.sln /p:Configuration=Release
      - name: Run Release executable and test for crashes
        run: |
          cd bin/Release
          Start-Process .\Game.exe
          Start-Sleep -Seconds 10
          Stop-Process -Name Game -ErrorAction SilentlyContinue
        shell: pwsh


  build-android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Cache build directory
        uses: actions/cache@v3
        with:
          path: build
          key: ${{ runner.os }}-build-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-build-
      - name: Download Cppcheck
        run: |
          curl -L -o cppcheck.zip https://github.com/danmar/cppcheck/releases/download/2.14.0/cppcheck-2.14.0-x64.zip
          tar -xf cppcheck.zip || unzip cppcheck.zip
      - name: Run cppcheck static analysis
        run: |
          ./cppcheck-2.14.0-x64/cppcheck --enable=warning,style,performance,portability --std=c++20 --output-file=cppcheck_report.txt . 2> cppcheck_report.txt
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install NDK 27.0.12077973
        run: |
          $sdkmanager = "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager"
          & $sdkmanager "ndk;27.0.12077973"
      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v2
      - name: Run build.bat first
        run: .\build.bat
      - name: Build Android app (x86_64)
        working-directory: android
        env:
          CI_ABI: x86_64
        run: .\gradlew.bat assembleDebug
