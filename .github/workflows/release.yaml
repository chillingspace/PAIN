name: Create GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_name:
        description: 'Name of the release'
        required: true
        default: 'Release v1.0.0'
      windows_run_id:
        description: 'The Run ID of the successful Windows CI/CD'
        required: true
      android_run_id:
        description: 'The Run ID of the successful Android CI/CD'
        required: true

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Create Artifact Directory
        run: mkdir release-artifacts

      - name: Download Windows Installer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download ${{ github.event.inputs.windows_run_id }} \
            --name Friends-Frog-ever-Installer \
            --dir release-artifacts/

      - name: Download Android APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download ${{ github.event.inputs.android_run_id }} \
            --name release-apk \
            --dir release-artifacts/

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.event.inputs.tag_name }} \
            --title "${{ github.event.inputs.release_name }}" \
            --notes "Automated release of Friends-Frog-ever." \
            release-artifacts/*.exe \
            release-artifacts/*.apk
