name: Create GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_name:
        description: 'Name of the release'
        required: true
        default: 'Release v1.0.0'

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: Friends-Frog-ever-Installer
          path: release-artifacts/
          # This will download the artifact from the most recent successful run of any workflow that produced it
          # You might need to specify a run-id if you want a specific build

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: release-artifacts/

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.event.inputs.tag_name }} \
            --title "${{ github.event.inputs.release_name }}" \
            --notes "Automated release of Friends-Frog-ever." \
            release-artifacts/*
